<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lost — Anaya</title>
  <meta name="description" content="This page fluttered off somewhere. Head back to Anaya's homepage.">
  <meta name="theme-color" content="#6b3fa0">
  <meta name="robots" content="noindex">
  <script>(function(){try{var t=localStorage.getItem('anaya-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    .lost { text-align: center; padding: 5rem 0 2rem; }
    .lost img { height: 96px; width: auto; margin-bottom: 1.4rem; }
  </style>
</head>
<body>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.6 12H5M19 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 15.2A8 8 0 0 1 9.3 4 7 7 0 1 0 20.5 15.2z"/></svg>
  </button>

  <div class="wrap">
    <div class="lost">
      <img class="ink-dark" src="butterfly-dark.png" alt="" aria-hidden="true">
      <img class="ink-light" src="butterfly-light.png" alt="" aria-hidden="true">
      <div class="kicker">error 404</div>
      <h1 class="title">This page fluttered <em>away</em></h1>
      <p class="sub" style="margin: 0.9rem auto 1.6rem;">The link you followed doesn't lead anywhere — but there's plenty else to see.</p>
      <p><a href="index.html">← back home</a></p>
    </div>
  </div>

  <script>
    function toggleTheme() {
      var d = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
      localStorage.setItem('anaya-theme', d ? 'light' : 'dark');
    }
  </script>
</body>
</html>
