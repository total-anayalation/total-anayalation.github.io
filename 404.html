  <style>
    .lost {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.8rem;
    }
    .lost-fly { animation: floaty 4s ease-in-out infinite; margin-bottom: 1.5rem; }
    @keyframes floaty {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50%     { transform: translateY(-14px) rotate(5deg); }
    }
    .lost-code {
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--lavender); margin-bottom: 0.6rem;
    }
    .lost-title {
      font-family: 'Lora', serif; font-weight: 600;
      font-size: clamp(2rem, 6vw, 3.2rem); color: var(--plum);
      letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 0.9rem;
    }
    .lost-title em { font-style: italic; color: var(--violet); }
    .lost-sub {
      font-size: 0.92rem; color: var(--ink2); line-height: 1.7;
      max-width: 420px; margin-bottom: 2rem;
    }
    .lost-btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: linear-gradient(135deg, #3b1f5e, #6b3fa0);
      color: white; text-decoration: none; border-radius: 100px;
      padding: 0.7rem 1.7rem; font-size: 0.84rem; font-weight: 500;
      box-shadow: 0 4px 20px rgba(107,63,160,0.32);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .lost-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(107,63,160,0.42); }
  </style>
</head>
<body>
  <div class="blob blob-1"></div><div class="blob blob-2"></div>

    <div class="lost-code">Error 404</div>
    <h1 class="lost-title">This page fluttered <em>away</em></h1>
    <p class="lost-sub">The link you followed doesn't lead anywhere — but there's plenty else to explore.</p>
    <a href="index.html" class="lost-btn">← Back home</a>
  </main>

  <script>
    function toggleTheme() {
      const d = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
      localStorage.setItem('anaya-theme', d ? 'light' : 'dark');
    }
  </script>
